<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!-- Favicon (FIXED PATH) -->
        <link rel="icon" href="/logo.jpg" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />

        <!-- SEO -->
        <title>InvoHealth</title>
        <meta
            name="description"
            content="Manage medical records, appointments, and billing in one place with InvoHealth."
        />

        <!-- Google Verification -->
        <meta
            name="google-site-verification"
            content="Oz-6mupzLgPcs2QliNknwuzHsqPCbYSPI8qdvuNHmOo"
        />

        <!-- Open Graph (VERY IMPORTANT FOR WHATSAPP/FACEBOOK) -->
        <meta property="og:site_name" content="InvoHealth" />
        <meta property="og:title" content="InvoHealth" />
        <meta
            property="og:description"
            content="Manage medical records, appointments, and billing in one place."
        />
        <meta property="og:url" content="https://invohealth.vercel.app/" />
        <meta property="og:type" content="website" />

        <!-- IMAGE (MUST LOAD DIRECTLY) -->
        <meta
            property="og:image"
            content="https://invohealth.vercel.app/logo.jpg"
        />
        <meta
            property="og:image:secure_url"
            content="https://invohealth.vercel.app/logo.jpg"
        />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="512" />
        <meta property="og:image:height" content="512" />

        <!-- Twitter (optional but helps some previews) -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="InvoHealth" />
        <meta
            name="twitter:description"
            content="Manage medical records and appointments easily."
        />
        <meta
            name="twitter:image"
            content="https://invohealth.vercel.app/logo.jpg"
        />

        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
